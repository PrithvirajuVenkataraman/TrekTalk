name: Group radio checks
on:
  workflow_dispatch:
  push:
    branches: [main, test/group-radio-v9, test/rear-camera, test/host-scan, test/scanned-guests, test/silent-join, test/no-audio, test/pairing-recovery, test/mobile-v16, test/scan-ui-v17]
    paths:
      - 'radio/**'
      - 'server/**'
      - 'api/**'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'style.css'
      - 'tests/**'
      - '.github/workflows/group-radio.yml'
permissions:
  contents: read
jobs:
  offline-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check QR and channel routing
        run: node --test tests/*.cjs
      - name: Install test driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1
      - name: Check visible QR detection within two seconds
        run: node tests/browser-scan.mjs
        env:
          TREKTALK_SCREENSHOTS: /tmp/trektalk-ui
      - name: Test ten silent devices with microphone and audio playback blocked
        run: node tests/browser-group.mjs
        env:
          TREKTALK_SCREENSHOTS: /tmp/trektalk-ui
      - name: Test updates from cached v8 through v16 installations
        run: |
          for version in 8 9 10 11 12 13 14 15 15.1 16; do
            export TREKTALK_PREVIOUS_VERSION="$version"
            export TREKTALK_PREVIOUS_ROOT="$RUNNER_TEMP/trektalk-v$version"
            case "$version" in
              8) ref=8a5fa273b97c959f25645001cee16bcb6df3dce7 ;;
              9) ref=2226220dacaf98dfc3c13951c9ae934472709718 ;;
              10) ref=d5b59892097b4b92ace4e6bc25e1c65e4543c755 ;;
              11) ref=b30116b16adf7f1fe277134e54b6f7b087d396d0 ;;
              12) ref=848b6432dda11af6b2202223f68ff062601579e7 ;;
              13) ref=ee9553d9c5af9fceec2cdf3d91faac5b38713465 ;;
              14) ref=bb274de1b191569a7c778859c91f7adbfdf97961 ;;
              15) ref=9e735a8647269a23994256b339301627699be0a6 ;;
              15.1) ref=2e40dfef4f0b4c9a8551c9031e0b306508fbcb74 ;;
              16) ref=0e24820a26dc1fa252e8bab3026f46bdface24f2 ;;
            esac
            mkdir -p "$TREKTALK_PREVIOUS_ROOT"
            git archive "$ref" | tar -x -C "$TREKTALK_PREVIOUS_ROOT"
            node tests/browser-upgrade.mjs
          done

      - name: Save mobile interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui
          path: /tmp/trektalk-ui
          retention-days: 7

  mobile-browsers:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright-core install chromium firefox webkit
      - name: Test all host and guest browser combinations
        run: node tests/browser-mobile.mjs
