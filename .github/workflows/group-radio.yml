name: Group radio checks
on:
  workflow_dispatch:
  push:
    branches: [main, test/group-radio-v9]
    paths:
      - 'radio/**'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/group-radio.yml'
permissions:
  contents: read
jobs:
  offline-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check QR and channel routing
        run: node --test tests/*.cjs
      - name: Install test driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1
      - name: Test ten radios with offline camera pairing and audio
        run: node tests/browser-group.mjs
      - name: Test updating a phone with a cached v8 installation
        run: |
          export TREKTALK_V8_ROOT="$RUNNER_TEMP/trektalk-v8"
          mkdir -p "$TREKTALK_V8_ROOT"
          git archive 8a5fa273b97c959f25645001cee16bcb6df3dce7 | tar -x -C "$TREKTALK_V8_ROOT"
          node tests/browser-upgrade.mjs
