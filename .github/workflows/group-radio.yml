name: Group radio checks
on:
  workflow_dispatch:
  push:
    branches: [main, test/group-radio-v9, test/rear-camera, test/host-scan]
    paths:
      - 'radio/**'
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/group-radio.yml'
permissions:
  contents: read
jobs:
  offline-radio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check QR and channel routing
        run: node --test tests/*.cjs
      - name: Install test driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1
      - name: Test ten radios with offline camera pairing and audio
        run: node tests/browser-group.mjs
      - name: Test updates from cached v8, v9 and v10 installations
        run: |
          for version in 8 9 10; do
            export TREKTALK_PREVIOUS_VERSION="$version"
            export TREKTALK_PREVIOUS_ROOT="$RUNNER_TEMP/trektalk-v$version"
            case "$version" in
              8) ref=8a5fa273b97c959f25645001cee16bcb6df3dce7 ;;
              9) ref=2226220dacaf98dfc3c13951c9ae934472709718 ;;
              10) ref=d5b59892097b4b92ace4e6bc25e1c65e4543c755 ;;
            esac
            mkdir -p "$TREKTALK_PREVIOUS_ROOT"
            git archive "$ref" | tar -x -C "$TREKTALK_PREVIOUS_ROOT"
            node tests/browser-upgrade.mjs
          done
