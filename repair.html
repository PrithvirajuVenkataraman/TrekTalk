<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update TrekTalk</title><style>body{font:18px system-ui;max-width:500px;margin:60px auto;padding:25px;background:#102d29;color:white}button{padding:20px;font:inherit}</style><h1>Update TrekTalk to v3</h1><p>This clears only TrekTalk's offline app files and ends any active pairing. Keep internet on.</p><button id="repair">Load the corrected app</button><p id="status"></p><script>
document.getElementById('repair').onclick=async()=>{try{document.getElementById('status').textContent='Updating…';for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())if(k.startsWith('trektalk-'))await caches.delete(k);location.replace('./?version=3');}catch(e){document.getElementById('status').textContent=e.message;}};
</script>
