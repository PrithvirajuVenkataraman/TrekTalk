<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update TrekTalk</title><style>body{font:18px system-ui;max-width:30rem;margin:3rem auto;padding:1rem;background:#10251e;color:white}button{padding:1rem;font:inherit}</style><h1>Update TrekTalk</h1><p>Connect to the internet and close any active call before updating the offline files.</p><button id="refresh">Load current version</button><p id="status" role="status"></p><script>
document.getElementById('refresh').onclick = async () => {
  try {
    document.getElementById('status').textContent = 'Updating…';
    for (const reg of await navigator.serviceWorker.getRegistrations()) {
      if (reg.active?.scriptURL === new URL('./sw.js', location.href).href) await reg.unregister();
    }
    for (const name of await caches.keys()) if (name.startsWith('trektalk-')) await caches.delete(name);
    location.replace('./?update=' + Date.now());
  } catch (e) { document.getElementById('status').textContent = e.message; }
};
</script></html>
