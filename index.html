<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10251e">
  <meta name="color-scheme" content="dark">
  <title>TrekTalk</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css?v=9">
</head>
<body>
<main>
  <header>
    <span class="brand"><img src="./icon.svg" alt="" width="34" height="34">TrekTalk</span>
    <span class="version">v9</span>
    <details id="tools" hidden>
      <summary>Options</summary>
      <div class="menu">
        <button id="photo" type="button">Read QR from photo</button>
        <button id="retryCamera" type="button">Restart front camera</button>
        <button id="leave" type="button">Leave group</button>
      </div>
    </details>
  </header>
  <section id="home">
    <h1>Group radio</h1>
    <p>Join the same hotspot. Keep both screens on.</p>
    <label for="name">Your name</label>
    <input id="name" type="text" maxlength="24" placeholder="Name on the radio" autocomplete="nickname">
    <div class="startActions">
      <button id="host" class="primary" type="button">Host a group</button>
      <button id="guest" type="button">Scan host QR</button>
    </div>
    <p id="offline" class="small" role="status">Saving files for offline use…</p>
    <p id="notice" role="alert"></p>
  </section>
  <section id="pair" hidden>
    <div id="pairMeta" class="meta"></div>
    <h1 id="pairTitle">Pair phones</h1>
    <p id="pairHint" aria-live="polite"></p>
    <div class="optics" id="optics">
      <video id="camera" muted playsinline autoplay aria-label="Camera preview"></video>
      <div id="guide" aria-hidden="true"></div>
      <button type="button" class="qrCard" id="hostCard" hidden aria-label="Refresh host QR offline">
        <canvas id="hostQr" aria-label="Group invitation QR code"></canvas>
      </button>
      <canvas id="replyQr" class="qrCard" aria-label="Automatic pairing reply" hidden></canvas>
      <div id="preparing" aria-live="polite">Starting camera…</div>
    </div>
    <button id="go" class="primary" type="button" hidden disabled>Go to Talkie</button>
  </section>
  <section id="radio" hidden>
    <div id="roomMeta" class="meta"></div>
    <h1>Talkie</h1>
    <div id="channel" class="channel" data-mode="idle" role="status" aria-live="polite"><i></i><span id="channelLabel">Listening</span></div>
    <p class="usage">Hold a button to speak. Release to listen.</p>
    <div id="targets" class="targets"></div>
    <button id="resume" type="button" hidden>Enable radio audio</button>
    <button id="add" type="button" class="plain" hidden>Pair another phone</button>
  </section>
  <input id="photoFile" type="file" accept="image/*" hidden>
</main>
<script src="./vendor/qr.js"></script>
<script src="./vendor/scan.js"></script>
<script src="./vendor/pako.js"></script>
<script type="module" src="./app.js?v=9"></script>
</body>
</html>
